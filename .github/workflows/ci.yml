name: Rafeeq CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Schema
        run: npm -w packages/schema run build

      - name: Build Frontend
        run: npm -w web run build

      - name: Typecheck Worker
        run: npm -w worker run typecheck
